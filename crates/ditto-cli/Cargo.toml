[package]
name = "ditto-cli"
description = "The `ditto` command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ditto"
path = "src/main.rs"

[dependencies]
ditto-core = { workspace = true }
rie-core = { workspace = true }
ditto-vision = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Only in tests: the inference engine's own manifest loader and tool runner, to prove the
# bridge works with the code that will call it.
rie-server = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
